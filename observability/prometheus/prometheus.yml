global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métriques Airflow : StatsD (UDP 9125) converti au format Prometheus par statsd-exporter.
  - job_name: airflow
    static_configs:
      - targets: ["statsd-exporter:9102"]
        labels:
          service: airflow

  # Métriques PostgreSQL du Data Warehouse.
  # Les labels release / kubernetes_namespace sont attendus par le dashboard Grafana 9628
  # (conçu pour Kubernetes) : on les fixe ici pour qu'il fonctionne sans modification.
  - job_name: postgres-dwh
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres-dwh
          release: maelys-dwh
          kubernetes_namespace: docker-compose
